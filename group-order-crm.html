<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group Order CRM — The Uniform Store</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700;9..40,800&display=swap"
    rel="stylesheet" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    /* ============================================================
       TUS DESIGN TOKENS
       ============================================================ */
    :root {
      --tus-navy:        #003366;
      --tus-navy-deep:   #0d123c;
      --tus-orange:      #ff6f00;
      --tus-orange-deep: #cc5900;
      --tus-mint:        #c8e6dd;
      --tus-cream:       #efe8de;
      --tus-ink:         #3c4653;
      --tus-ink-2:       #3d4246;
      --tus-muted:       #4b5563;
      --tus-line:        #e5e7eb;
      --tus-bg:          #ffffff;
      --tus-bg-soft:     #f7f6f3;

      --font-display: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;
      --font-body:    'DM Sans', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif;

      --shadow-card:  0 2px 8px rgba(13, 18, 60, 0.08);
      --shadow-pop:   0 4px 16px rgba(13, 18, 60, 0.12);
      --shadow-modal: 0 20px 60px rgba(13, 18, 60, 0.25);
      --shadow-focus: 0 0 0 2px rgba(255, 111, 0, 0.35);

      --tracking-caps: 0.08em;
      --tracking-wide: 0.02em;

      --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-body);
      background: var(--tus-bg-soft);
      color: var(--tus-ink);
      height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
      line-height: 1.5;
    }

    /* ── Header ── */
    .header {
      background: var(--tus-navy);
      color: #fff;
      padding: 0 24px;
      height: 56px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      border-bottom: 1px solid var(--tus-navy-deep);
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .header .logo {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
    }

    .header .logo svg {
      width: 40px;
      height: 40px;
      display: block;
    }

    .header .brand-name {
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps);
      white-space: nowrap;
    }

    .header h1 {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      color: var(--tus-mint);
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps);
      white-space: nowrap;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    /* ── Stats bar ── */
    .stats-bar {
      background: #fff;
      border-bottom: 1px solid var(--tus-line);
      padding: 12px 24px;
      display: flex;
      gap: 32px;
      overflow-x: auto;
    }

    .stat {
      display: flex;
      flex-direction: column;
      align-items: center;
      min-width: 88px;
    }

    .stat-value {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 700;
      color: var(--tus-navy);
      letter-spacing: -0.01em;
      line-height: 1.1;
    }

    .stat-label {
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      color: var(--tus-muted);
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps);
      margin-top: 4px;
    }

    /* ── Board ── */
    .board-wrapper {
      padding: 16px 24px;
      overflow-x: auto;
      height: calc(100vh - 56px - 57px);
    }

    .board {
      display: flex;
      gap: 12px;
      min-width: max-content;
      height: 100%;
    }

    /* ── Columns ── */
    .column {
      width: 265px;
      display: flex;
      flex-direction: column;
      background: #fff;
      border: 1px solid var(--tus-line);
      border-radius: 0;
      overflow: hidden;
      flex-shrink: 0;
    }

    .col-header {
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--tus-line);
    }

    .col-title {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps);
    }

    .col-count {
      background: rgba(0, 0, 0, 0.18);
      color: inherit;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 0;
      letter-spacing: var(--tracking-wide);
    }

    .col-cards {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: var(--tus-bg-soft);
    }

    .col-cards::-webkit-scrollbar {
      width: 4px;
    }

    .col-cards::-webkit-scrollbar-thumb {
      background: rgba(13, 18, 60, 0.18);
      border-radius: 0;
    }

    /* Stage colours — brand-aligned palette */
    .stage-new_lead .col-header {
      background: var(--tus-navy);
      color: #fff;
    }

    .stage-discovery .col-header {
      background: var(--tus-mint);
      color: var(--tus-navy);
    }

    .stage-quoting .col-header {
      background: var(--tus-orange);
      color: #fff;
    }

    .stage-follow_up .col-header {
      background: var(--tus-cream);
      color: var(--tus-navy);
    }

    .stage-won .col-header {
      background: #0a7a44;
      color: #fff;
    }

    .stage-lost .col-header {
      background: #94a3b8;
      color: #fff;
    }

    /* ── Cards ── */
    .card {
      background: #fff;
      border-radius: 0;
      padding: 12px;
      cursor: pointer;
      border: 1px solid var(--tus-line);
      transition: border-color 150ms var(--ease-out), box-shadow 150ms var(--ease-out), transform 120ms var(--ease-out);
      box-shadow: var(--shadow-card);
    }

    .card:hover {
      border-color: var(--tus-navy);
      box-shadow: var(--shadow-pop);
      transform: translateY(-1px);
    }

    .card.overdue {
      border-left: 3px solid var(--tus-orange);
    }

    .card-org {
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      color: var(--tus-navy);
      margin-bottom: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-contact {
      font-size: 12px;
      color: var(--tus-muted);
      margin-bottom: 8px;
    }

    .card-meta {
      display: flex;
      align-items: center;
      gap: 5px;
      flex-wrap: wrap;
    }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      font-family: var(--font-display);
      font-size: 10px;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 0;
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps);
      white-space: nowrap;
    }

    .badge-us {
      background: var(--tus-navy);
      color: #fff;
    }

    .badge-them {
      background: var(--tus-mint);
      color: var(--tus-navy);
    }

    .badge-value {
      background: var(--tus-cream);
      color: var(--tus-navy);
    }

    .badge-overdue {
      background: var(--tus-orange);
      color: #fff;
    }

    .badge-followup {
      background: #fff3b0;
      color: #7a5a00;
    }

    /* Add card */
    .add-card-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      border: 1px dashed rgba(60, 70, 83, 0.35);
      border-radius: 0;
      color: var(--tus-muted);
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      cursor: pointer;
      transition: border-color 150ms var(--ease-out), color 150ms var(--ease-out), background 150ms var(--ease-out);
      margin-top: 2px;
    }

    .add-card-btn:hover {
      background: #fff;
      border-color: var(--tus-navy);
      color: var(--tus-navy);
    }

    /* ── Side Panel ── */
    .side-panel {
      position: fixed;
      right: 0;
      top: 0;
      bottom: 0;
      width: 80%;
      background: #fff;
      box-shadow: -4px 0 24px rgba(13, 18, 60, 0.18);
      z-index: 200;
      transform: translateX(100%);
      transition: transform 250ms var(--ease-out);
      display: flex;
      flex-direction: column;
    }

    .side-panel.open {
      transform: translateX(0);
    }

    .panel-header {
      padding: 18px 22px;
      border-bottom: 1px solid var(--tus-line);
      background: var(--tus-bg-soft);
    }

    .panel-org {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--tus-navy);
      letter-spacing: -0.01em;
      margin-bottom: 10px;
    }

    .panel-header-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-close {
      background: none;
      border: none;
      cursor: pointer;
      color: var(--tus-muted);
      font-size: 20px;
      padding: 0 4px;
      line-height: 1;
      margin-left: auto;
      transition: color 120ms var(--ease-out);
    }

    .panel-close:hover {
      color: var(--tus-navy);
    }

    .panel-stage-select {
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 0;
      border: 1px solid rgba(60, 70, 83, 0.55);
      background: #fff;
      cursor: pointer;
      color: var(--tus-navy);
      transition: border-color 120ms var(--ease-out);
    }

    .panel-stage-select:focus {
      outline: none;
      border-color: var(--tus-navy);
      box-shadow: var(--shadow-focus);
    }

    /* Tabs */
    .panel-tabs {
      display: flex;
      gap: 4px;
      border-bottom: 1px solid var(--tus-line);
      padding: 0 22px;
      background: #fff;
    }

    .tab {
      padding: 12px 16px;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      color: var(--tus-muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      transition: color 120ms var(--ease-out), border-color 120ms var(--ease-out);
    }

    .tab:hover {
      color: var(--tus-navy);
    }

    .tab.active {
      color: var(--tus-navy);
      border-bottom-color: var(--tus-orange);
    }

    /* Panel body */
    .panel-body {
      flex: 1;
      overflow-y: auto;
      padding: 22px;
    }

    .panel-body::-webkit-scrollbar {
      width: 4px;
    }

    .panel-body::-webkit-scrollbar-thumb {
      background: var(--tus-line);
      border-radius: 0;
    }

    /* Fields */
    .field-group {
      margin-bottom: 16px;
    }

    .field-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field-label {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      color: var(--tus-muted);
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps);
      margin-bottom: 6px;
    }

    .field-input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid rgba(60, 70, 83, 0.55);
      border-radius: 0;
      font-family: inherit;
      font-size: 13px;
      color: var(--tus-ink);
      background: #fff;
      transition: border-color 120ms var(--ease-out), box-shadow 120ms var(--ease-out);
    }

    .field-input:focus {
      outline: none;
      border-color: var(--tus-navy);
      box-shadow: var(--shadow-focus);
    }

    .field-textarea {
      resize: vertical;
      min-height: 70px;
      line-height: 1.5;
    }

    .field-textarea-lg {
      resize: vertical;
      min-height: 150px;
      line-height: 1.5;
    }

    .field-checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--tus-ink);
    }

    /* Section headers */
    .section-header {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      color: var(--tus-navy);
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps);
      margin: 22px 0 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--tus-line);
    }

    /* Panel footer */
    .panel-footer {
      padding: 16px 22px;
      border-top: 1px solid var(--tus-line);
      background: var(--tus-bg-soft);
      display: flex;
      gap: 8px;
    }

    /* Activity log */
    .activity-log {
      display: flex;
      flex-direction: column;
    }

    .activity-item {
      display: flex;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--tus-line);
    }

    .activity-item:last-child {
      border-bottom: none;
    }

    .activity-icon {
      width: 32px;
      height: 32px;
      border-radius: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      flex-shrink: 0;
      margin-top: 1px;
      border: 1px solid var(--tus-line);
    }

    .activity-body {
      flex: 1;
    }

    .activity-meta {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      color: var(--tus-muted);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
    }

    .activity-notes {
      font-size: 13px;
      color: var(--tus-ink);
      margin-top: 4px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .activity-notes a {
      color: var(--tus-orange-deep);
    }

    .activity-type-note {
      background: var(--tus-bg-soft);
    }

    .activity-type-call {
      background: var(--tus-mint);
    }

    .activity-type-email {
      background: var(--tus-cream);
    }

    .activity-type-stage_change {
      background: #dcfce7;
    }

    .activity-type-quote_sent {
      background: #ffe0b8;
    }

    .activity-type-follow_up_sent {
      background: #fff3b0;
    }

    /* Add activity */
    .add-activity {
      background: var(--tus-bg-soft);
      border: 1px solid var(--tus-line);
      border-left: 3px solid var(--tus-orange);
      border-radius: 0;
      padding: 16px;
      margin-bottom: 18px;
    }

    .add-activity-title {
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 700;
      color: var(--tus-navy);
      text-transform: uppercase;
      letter-spacing: var(--tracking-caps);
      margin-bottom: 12px;
    }

    .type-chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }

    .type-chip {
      padding: 5px 12px;
      border-radius: 0;
      font-family: var(--font-display);
      font-size: 11px;
      font-weight: 600;
      border: 1px solid rgba(60, 70, 83, 0.35);
      background: #fff;
      cursor: pointer;
      color: var(--tus-muted);
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      transition: border-color 120ms var(--ease-out), background 120ms var(--ease-out), color 120ms var(--ease-out);
    }

    .type-chip:hover {
      border-color: var(--tus-navy);
      color: var(--tus-navy);
    }

    .type-chip.selected {
      border-color: var(--tus-navy);
      background: var(--tus-navy);
      color: #fff;
    }

    /* ── Modal ── */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(13, 18, 60, 0.55);
      z-index: 300;
      display: none;
      align-items: center;
      justify-content: center;
      backdrop-filter: blur(2px);
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal {
      background: #fff;
      border-radius: 0;
      width: 580px;
      max-width: 95vw;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-modal);
      border-top: 4px solid var(--tus-orange);
    }

    .modal-header {
      padding: 22px 26px 18px;
      border-bottom: 1px solid var(--tus-line);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      color: var(--tus-navy);
      letter-spacing: -0.01em;
    }

    .modal-body {
      padding: 22px 26px;
    }

    .modal-footer {
      padding: 16px 26px;
      border-top: 1px solid var(--tus-line);
      background: var(--tus-bg-soft);
      display: flex;
      gap: 8px;
      justify-content: flex-end;
    }

    /* ── Buttons ── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 20px;
      border-radius: 0;
      font-family: var(--font-display);
      font-size: 13px;
      font-weight: 600;
      letter-spacing: var(--tracking-wide);
      text-transform: uppercase;
      cursor: pointer;
      border: none;
      min-height: 40px;
      white-space: nowrap;
      transition: background 200ms var(--ease-out), color 200ms var(--ease-out), border-color 200ms var(--ease-out), transform 120ms var(--ease-out);
    }

    .btn:active {
      transform: translateY(1px);
    }

    .btn-primary {
      background: var(--tus-orange);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--tus-orange-deep);
    }

    .btn-secondary {
      background: transparent;
      color: var(--tus-navy);
      border: 1px solid var(--tus-navy);
    }

    .btn-secondary:hover {
      background: var(--tus-navy);
      color: #fff;
    }

    /* Header sits on navy — invert secondary buttons so they're visible */
    .header .btn-secondary {
      color: #fff;
      border-color: rgba(255, 255, 255, 0.55);
    }

    .header .btn-secondary:hover {
      background: #fff;
      color: var(--tus-navy);
      border-color: #fff;
    }

    .btn-danger {
      background: transparent;
      color: #b91c1c;
      border: 1px solid #b91c1c;
    }

    .btn-danger:hover {
      background: #b91c1c;
      color: #fff;
    }

    .btn-sm {
      padding: 6px 14px;
      font-size: 11px;
      min-height: 32px;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(120px);
      background: var(--tus-navy);
      color: #fff;
      padding: 12px 22px;
      border-radius: 0;
      font-family: var(--font-display);
      font-size: 12px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: var(--tracking-wide);
      z-index: 999;
      transition: transform 300ms var(--ease-out);
      box-shadow: var(--shadow-pop);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ── Misc ── */
    .empty-col {
      text-align: center;
      padding: 22px 10px;
      color: var(--tus-muted);
      font-size: 12px;
      font-style: italic;
    }

    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100px;
      color: var(--tus-muted);
      font-size: 13px;
      gap: 8px;
    }
  </style>
</head>

<body>

  <div id="app">

    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <div class="logo">
          <svg viewBox="0 0 220 220" version="1.1" xmlns="http://www.w3.org/2000/svg" xml:space="preserve"
            style="fill-rule:evenodd;clip-rule:evenodd;stroke-linejoin:round;stroke-miterlimit:2;">
            <g>
              <circle cx="109.644" cy="109.644" r="109.644" style="fill:#fff;" />
              <circle cx="109.644" cy="109.644" r="98.644" style="fill:#036;" />
              <path
                d="M188.756,79.58c0,-1.793 -3.108,-2.294 -4.943,-2.674c-3.674,-0.76 -11.628,-1.885 -17.101,-1.885c-6.721,0 -15.625,0.096 -23.042,5.722c-3.99,3.027 -5.628,8.923 -5.628,13.931c0,4.044 -0.7,12.368 8.022,19.038c5.55,4.244 25.855,6.443 25.256,12.545c-0.374,3.803 -5.463,4.604 -9.206,4.582c-4.645,-0.026 -15.187,-1.888 -18.604,-2.795c-1.539,-0.408 -2.571,0.072 -2.771,0.98c-0.528,2.396 -2.193,9.657 -2.8,12.435c-0.232,1.062 -0.252,1.84 0.766,2.221c4.013,1.502 11.065,4.015 23.716,4.015c9.191,-0 29.842,-1.94 30.473,-19.839c0.541,-15.355 -10.279,-20.555 -15.059,-22.271c-6.18,-2.219 -18.664,-4.21 -18.578,-9.159c0.058,-3.322 4.89,-4.119 10.906,-4.119c6.016,0 13.103,2.133 16.061,2.802c0.814,0.184 1.87,-0.771 1.922,-1.603c0.172,-2.73 0.61,-11.191 0.61,-13.926Z"

              <path

        <span class="brand-name">The Uniform Store</span>
      </div>
      <div class="header-right">
        <h1>Group Order <span style="color:#ff6f00;">CRM</span>
        </h1>
        <div class="header-actions">
          <a href="email-drafter.html" target="_blank" class="btn btn-secondary btn-sm" style="text-decoration:none;">✉ Email Drafter</a>
          <button class="btn btn-secondary btn-sm" onclick="loadLeads()">↻ Refresh</button>
          <button class="btn btn-primary btn-sm" onclick="openNewLeadModal()">+ New Lead</button>
        </div>
      </div>
    </div>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <div class="stat">
        <div class="stat-value" id="stat-total">—</div>
        <div class="stat-label">Total Leads</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-pipeline">—</div>
        <div class="stat-label">Active</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-value">—</div>
        <div class="stat-label">Pipeline Value</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-overdue">—</div>
        <div class="stat-label">Overdue</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-them">—</div>
        <div class="stat-label">Ball in Their Court</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-won">—</div>
        <div class="stat-label">Won (30d)</div>
      </div>
    </div>

    <!-- Board -->
    <div class="board-wrapper">
      <div class="board" id="board">
        <div class="loading">⏳ Loading leads…</div>
      </div>
    </div>

    <!-- Backdrop -->
    <div id="backdrop" style="position:fixed;inset:0;z-index:150;display:none;background:rgba(13,18,60,0.25);" onclick="closePanel()"></div>

    <!-- Side Panel -->
    <div class="side-panel" id="sidePanel">
      <div class="panel-header">
        <div class="panel-org" id="panelOrg">—</div>
        <div class="panel-header-row">
          <select class="panel-stage-select" id="panelStage" onchange="updateLeadStage(this.value)">
            <option value="new_lead">🆕 New Lead</option>
            <option value="discovery">🔍 Discovery</option>
            <option value="quoting">📋 Quoting</option>
            <option value="follow_up">📬 Follow-up</option>
            <option value="won">🏆 Won</option>
            <option value="lost">❌ Lost</option>
          </select>
          <div id="panelLastContact"></div>
          <button class="panel-close" onclick="closePanel()">✕</button>
        </div>
      </div>
      <div class="panel-tabs">
        <div class="tab active" onclick="switchTab('details', this)">Details</div>
        <div class="tab" onclick="switchTab('activity', this)">Activity Log</div>
      </div>
      <div class="panel-body" id="panelBody"></div>
      <div class="panel-footer">
        <button class="btn btn-primary btn-sm" onclick="saveLeadDetails()">Save Changes</button>
        <button class="btn btn-danger btn-sm" onclick="deleteLead()">Delete Lead</button>
      </div>
    </div>

    <!-- New Lead Modal -->
    <div class="modal-overlay" id="leadModal">
      <div class="modal">
        <div class="modal-header">
          <div class="modal-title">New Group Order Lead</div>
          <button class="panel-close" onclick="closeModal()">✕</button>
        </div>
        <div class="modal-body" id="modalBody"></div>
        <div class="modal-footer">
          <button class="btn btn-secondary" onclick="closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="saveNewLead()">Create Lead</button>
        </div>
      </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

  </div>

  <script>
    // ─────────────────────────────────────────────────────────────────────────────
    // CONFIG
    // ─────────────────────────────────────────────────────────────────────────────
    const SUPABASE_URL = 'https://yqvzausypbgiwutwxmtk.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlxdnphdXN5cGJnaXd1dHd4bXRrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQxODE1NzUsImV4cCI6MjA4OTc1NzU3NX0.HNNql_MbmfoDl69LeJr26zyP-CyXu45JOvWbYHh0e4c';
    const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const STAGES = [
      { key: 'new_lead', label: 'New Lead', emoji: '🆕' },
      { key: 'discovery', label: 'Discovery', emoji: '🔍' },
      { key: 'quoting', label: 'Quoting', emoji: '📋' },
      { key: 'follow_up', label: 'Follow-up', emoji: '📬' },
      { key: 'won', label: 'Won ✓', emoji: '🏆' },
      { key: 'lost', label: 'Lost', emoji: '❌' },
    ];

    const ACTIVITY_TYPES = [
      { key: 'note', label: 'Note', icon: '📝' },
      { key: 'call', label: 'Call', icon: '📞' },
      { key: 'email', label: 'Email', icon: '✉️' },
      { key: 'quote_sent', label: 'Quote Sent', icon: '📋' },
      { key: 'follow_up_sent', label: 'Follow-up', icon: '📬' },
      { key: 'stage_change', label: 'Stage', icon: '🔄' },
    ];

    let state = {
      leads: [],
      selectedLeadId: null,
      activities: [],
      activeTab: 'details',
      selectedActivityType: 'note',
    };

    // ─────────────────────────────────────────────────────────────────────────────
    // DATA
    // ─────────────────────────────────────────────────────────────────────────────
    async function init() {
      await loadLeads();
    }

    async function loadLeads() {
      const { data, error } = await db
        .from('group_order_leads')
        .select('*')
        .order('updated_at', { ascending: false });

      if (error) { showToast('Error loading leads: ' + error.message, 'error'); return; }
      state.leads = data || [];
      renderBoard();
      updateStats();
    }

    async function loadActivities(leadId) {
      const { data, error } = await db
        .from('group_order_activities')
        .select('*')
        .eq('lead_id', leadId)
        .order('created_at', { ascending: false });

      if (error) { showToast('Error loading activity', 'error'); return []; }
      state.activities = data || [];
      return data;
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // BOARD
    // ─────────────────────────────────────────────────────────────────────────────
    function renderBoard() {
      const board = document.getElementById('board');
      board.innerHTML = STAGES.map(stage => {
        const leads = state.leads.filter(l => l.stage === stage.key);
        return `
      <div class="column stage-${stage.key}">
        <div class="col-header">
          <span class="col-title">${stage.emoji} ${stage.label}</span>
          <span class="col-count">${leads.length}</span>
        </div>
        <div class="col-cards">
          ${leads.length === 0
            ? `<div class="empty-col">No leads here</div>`
            : leads.map(renderCard).join('')}
          <button class="add-card-btn" onclick="openNewLeadModalStage('${stage.key}')">+ Add lead</button>
        </div>
      </div>
    `;
      }).join('');
    }

    function renderCard(lead) {
      const today = new Date().toISOString().split('T')[0];
      const isOverdue = lead.next_followup_date
        && lead.next_followup_date < today
        && !['won', 'lost'].includes(lead.stage);

      const valueBadge = lead.estimated_value
        ? `<span class="badge badge-value">$${Number(lead.estimated_value).toLocaleString()}</span>`
        : '';

      const lcBadge = lead.last_contact_by
        ? `<span class="badge ${lead.last_contact_by === 'us' ? 'badge-us' : 'badge-them'}">${lead.last_contact_by === 'us' ? '↑ Us' : '↓ Them'}</span>`
        : '';

      const followupBadge = isOverdue
        ? `<span class="badge badge-overdue">⚠ Overdue</span>`
        : (lead.next_followup_date
          ? `<span class="badge badge-followup">📅 ${formatDate(lead.next_followup_date)}</span>`
          : '');

      return `
    <div class="card ${isOverdue ? 'overdue' : ''}" onclick="openLead('${lead.id}')">
      <div class="card-org" title="${esc(lead.org_name)}">${esc(lead.org_name)}</div>
      ${lead.contact_name ? `<div class="card-contact">${esc(lead.contact_name)}</div>` : ''}
      <div class="card-meta">
        ${valueBadge}
        ${lcBadge}
        ${followupBadge}
        ${lead.logo_path ? '<span class="badge" style="background:var(--tus-mint);color:var(--tus-navy)">🎨 Logo</span>' : ''}
      </div>
    </div>
  `;
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // STATS
    // ─────────────────────────────────────────────────────────────────────────────
    function updateStats() {
      const active = state.leads.filter(l => !['won', 'lost'].includes(l.stage));
      const pipelineValue = active.reduce((s, l) => s + (parseFloat(l.estimated_value) || 0), 0);
      const today = new Date().toISOString().split('T')[0];
      const overdue = active.filter(l => l.next_followup_date && l.next_followup_date < today).length;
      const inTheirCourt = active.filter(l => l.last_contact_by === 'us').length;
      const thirtyDaysAgo = new Date(Date.now() - 30 * 86400000).toISOString();
      const won30d = state.leads.filter(l => l.stage === 'won' && l.updated_at > thirtyDaysAgo).length;

      document.getElementById('stat-total').textContent = state.leads.length;
      document.getElementById('stat-pipeline').textContent = active.length;
      document.getElementById('stat-value').textContent = pipelineValue > 0 ? '$' + pipelineValue.toLocaleString() : '—';
      document.getElementById('stat-overdue').textContent = overdue;
      document.getElementById('stat-them').textContent = inTheirCourt;
      document.getElementById('stat-won').textContent = won30d;
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // SIDE PANEL
    // ─────────────────────────────────────────────────────────────────────────────
    async function openLead(leadId) {
      state.selectedLeadId = leadId;
      state.activeTab = 'details';
      const lead = state.leads.find(l => l.id === leadId);
      if (!lead) return;

      document.getElementById('panelOrg').textContent = lead.org_name;
      document.getElementById('panelStage').value = lead.stage;
      updatePanelLastContact(lead.last_contact_by);

      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === 0));

      renderDetailsTab(lead);
      if (lead.logo_path) loadLeadLogo(lead);
      document.getElementById('sidePanel').classList.add('open');
      document.getElementById('backdrop').style.display = 'block';

      await loadActivities(leadId);
    }

    function updatePanelLastContact(lc) {
      const el = document.getElementById('panelLastContact');
      if (!lc) { el.innerHTML = ''; return; }
      el.innerHTML = `<span class="badge ${lc === 'us' ? 'badge-us' : 'badge-them'}">${lc === 'us' ? '↑ Last: Us' : '↓ Last: Them'}</span>`;
    }

    function closePanel() {
      document.getElementById('sidePanel').classList.remove('open');
      document.getElementById('backdrop').style.display = 'none';
      state.selectedLeadId = null;
    }

    function switchTab(tab, el) {
      state.activeTab = tab;
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      const lead = state.leads.find(l => l.id === state.selectedLeadId);
      if (!lead) return;
      if (tab === 'details') {
        renderDetailsTab(lead);
        if (lead.logo_path) loadLeadLogo(lead);
      } else renderActivityTab(lead);
    }

    function renderDetailsTab(lead) {
      document.getElementById('panelBody').innerHTML = `

    <div class="section-header">Contact Information</div>
    <div class="field-group">
      <div class="field-label">Organisation Name *</div>
      <input class="field-input" id="f_org_name" value="${esc(lead.org_name || '')}">
    </div>
    <div class="field-row">
      <div class="field-group">
        <div class="field-label">Contact Name</div>
        <input class="field-input" id="f_contact_name" value="${esc(lead.contact_name || '')}">
      </div>
      <div class="field-group">
        <div class="field-label">Phone</div>
        <input class="field-input" id="f_contact_phone" value="${esc(lead.contact_phone || '')}">
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Email</div>
      <input class="field-input" id="f_contact_email" value="${esc(lead.contact_email || '')}">
    </div>

    <div class="section-header">Uniform Requirements</div>
    <div class="field-row">
      <div class="field-group">
        <div class="field-label">Brand Preferences</div>
        <input class="field-input" id="f_brand_preferences" value="${esc(lead.brand_preferences || '')}" placeholder="e.g. Grey's Anatomy, Dickies">
      </div>
      <div class="field-group">
        <div class="field-label">Colour Preferences</div>
        <input class="field-input" id="f_colour_preferences" value="${esc(lead.colour_preferences || '')}" placeholder="e.g. Navy, Royal Blue">
      </div>
    </div>
    <div class="field-group">
      <div class="field-checkbox-row">
        <input type="checkbox" id="f_male" ${lead.has_male_uniforms ? 'checked' : ''}>
        <label for="f_male">Male Uniforms</label>
        &nbsp;&nbsp;
        <input type="checkbox" id="f_female" ${lead.has_female_uniforms ? 'checked' : ''}>
        <label for="f_female">Female Uniforms</label>
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Embroidery / Decoration Notes</div>
      <textarea class="field-input field-textarea" id="f_embroidery_notes" placeholder="Logo placement, stitch count, thread colours…">${esc(lead.embroidery_notes || '')}</textarea>
    </div>

    ${lead.logo_path ? `
    <div class="section-header">Customer Logo</div>
    <div class="field-group" id="logoBox">
      <div class="loading" style="height:40px">⏳ Loading logo…</div>
    </div>` : ''}

    <div class="section-header">Quote</div>
    <div class="field-row">
      <div class="field-group">
        <div class="field-label">Estimated Value ($)</div>
        <input class="field-input" type="number" id="f_estimated_value" value="${lead.estimated_value || ''}">
      </div>
      <div class="field-group">
        <div class="field-label">Item Count</div>
        <input class="field-input" type="number" id="f_item_count" value="${lead.item_count || ''}">
      </div>
    </div>

    <div class="section-header">Follow-up</div>
    <div class="field-row">
      <div class="field-group">
        <div class="field-label">Next Follow-up Date</div>
        <input class="field-input" type="date" id="f_next_followup_date" value="${lead.next_followup_date || ''}">
      </div>
      <div class="field-group">
        <div class="field-label">Last Contact By</div>
        <select class="field-input" id="f_last_contact_by" onchange="updatePanelLastContact(this.value)">
          <option value="">— Unknown —</option>
          <option value="us"   ${lead.last_contact_by === 'us' ? 'selected' : ''}>Us (we reached out last)</option>
          <option value="them" ${lead.last_contact_by === 'them' ? 'selected' : ''}>Them (they reached out last)</option>
        </select>
      </div>
    </div>

    ${lead.stage === 'lost' ? `
    <div class="field-group">
      <div class="field-label">Lost Reason</div>
      <input class="field-input" id="f_lost_reason" value="${esc(lead.lost_reason || '')}" placeholder="Price, timing, went elsewhere…">
    </div>` : ''}

    <div class="field-group">
      <div class="field-label">Internal Notes</div>
      <textarea class="field-input field-textarea-lg" id="f_internal_notes" placeholder="Anything the team should know…">${esc(lead.internal_notes || '')}</textarea>
    </div>
  `;
    }

    async function renderActivityTab(lead) {
      document.getElementById('panelBody').innerHTML = `<div class="loading">⏳ Loading activity…</div>`;
      await loadActivities(lead.id);

      const actHtml = state.activities.length === 0
        ? `<div class="empty-col" style="padding:30px 10px">No activity logged yet</div>`
        : state.activities.map(a => {
          const aType = ACTIVITY_TYPES.find(t => t.key === a.activity_type) || { icon: '•', label: a.activity_type };
          const dirLabel = a.direction === 'inbound' ? ' · ← Inbound' : a.direction === 'outbound' ? ' · → Outbound' : '';
          return `
          <div class="activity-item">
            <div class="activity-icon activity-type-${a.activity_type}">${aType.icon}</div>
            <div class="activity-body">
              <div class="activity-meta">${aType.label}${dirLabel} · ${formatDateTime(a.created_at)}${a.created_by ? ' · ' + esc(a.created_by) : ''}</div>
              ${a.notes ? `<div class="activity-notes">${linkify(a.notes)}</div>` : ''}
            </div>
          </div>
        `;
        }).join('');

      document.getElementById('panelBody').innerHTML = `
    <div class="add-activity">
      <div class="add-activity-title">Log New Activity</div>
      <div class="type-chips" id="actTypeChips">
        ${ACTIVITY_TYPES.filter(t => t.key !== 'stage_change').map(t => `
          <div class="type-chip ${t.key === state.selectedActivityType ? 'selected' : ''}"
               onclick="selectActivityType('${t.key}', this)">${t.icon} ${t.label}</div>
        `).join('')}
      </div>
      <div class="field-row" style="margin-bottom:8px">
        <div>
          <div class="field-label">Direction</div>
          <select class="field-input" id="actDirection">
            <option value="">—</option>
            <option value="inbound">← Inbound (they reached out)</option>
            <option value="outbound">→ Outbound (we reached out)</option>
          </select>
        </div>
        <div>
          <div class="field-label">Logged by</div>
          <input class="field-input" id="actCreatedBy" placeholder="Your name">
        </div>
      </div>
      <textarea class="field-input field-textarea" id="actNotes" placeholder="Notes…" style="min-height:60px;margin-bottom:8px"></textarea>
      <button class="btn btn-primary btn-sm" onclick="logActivity()">Log Activity</button>
    </div>

    <div class="section-header">History (${state.activities.length})</div>
    <div class="activity-log">${actHtml}</div>
  `;
    }

    function selectActivityType(type, el) {
      state.selectedActivityType = type;
      document.querySelectorAll('.type-chip').forEach(c => c.classList.remove('selected'));
      el.classList.add('selected');
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // ACTIONS
    // ─────────────────────────────────────────────────────────────────────────────
    async function updateLeadStage(newStage) {
      if (!state.selectedLeadId) return;
      const lead = state.leads.find(l => l.id === state.selectedLeadId);
      const oldStage = lead.stage;

      const { error } = await db
        .from('group_order_leads')
        .update({ stage: newStage })
        .eq('id', state.selectedLeadId);

      if (error) { showToast('Error updating stage', 'error'); return; }

      await db.from('group_order_activities').insert({
        lead_id: state.selectedLeadId,
        activity_type: 'stage_change',
        notes: `Stage: ${formatStage(oldStage)} → ${formatStage(newStage)}`,
      });

      showToast('Stage updated ✓');
      await loadLeads();
    }

    async function saveLeadDetails() {
      if (!state.selectedLeadId) return;

      const lc = document.getElementById('f_last_contact_by')?.value || null;
      const lostEl = document.getElementById('f_lost_reason');

      const updates = {
        org_name: document.getElementById('f_org_name').value.trim(),
        contact_name: document.getElementById('f_contact_name').value.trim() || null,
        contact_email: document.getElementById('f_contact_email').value.trim() || null,
        contact_phone: document.getElementById('f_contact_phone').value.trim() || null,
        brand_preferences: document.getElementById('f_brand_preferences').value.trim() || null,
        colour_preferences: document.getElementById('f_colour_preferences').value.trim() || null,
        has_male_uniforms: document.getElementById('f_male').checked,
        has_female_uniforms: document.getElementById('f_female').checked,
        embroidery_notes: document.getElementById('f_embroidery_notes').value.trim() || null,
        estimated_value: document.getElementById('f_estimated_value').value || null,
        item_count: document.getElementById('f_item_count').value || null,
        next_followup_date: document.getElementById('f_next_followup_date').value || null,
        last_contact_by: lc,
        internal_notes: document.getElementById('f_internal_notes').value.trim() || null,
      };
      if (lostEl) updates.lost_reason = lostEl.value.trim() || null;

      if (!updates.org_name) { showToast('Organisation name is required', 'error'); return; }

      const { error } = await db
        .from('group_order_leads')
        .update(updates)
        .eq('id', state.selectedLeadId);

      if (error) { showToast('Error saving: ' + error.message, 'error'); return; }

      showToast('Saved ✓');
      document.getElementById('panelOrg').textContent = updates.org_name;
      updatePanelLastContact(lc);
      await loadLeads();
    }

    async function logActivity() {
      if (!state.selectedLeadId) return;

      const notes = document.getElementById('actNotes').value.trim() || null;
      const direction = document.getElementById('actDirection').value || null;
      const createdBy = document.getElementById('actCreatedBy').value.trim() || null;

      if (direction === 'inbound') {
        await db.from('group_order_leads').update({ last_contact_by: 'them' }).eq('id', state.selectedLeadId);
      } else if (direction === 'outbound') {
        await db.from('group_order_leads').update({ last_contact_by: 'us' }).eq('id', state.selectedLeadId);
      }

      const { error } = await db.from('group_order_activities').insert({
        lead_id: state.selectedLeadId,
        activity_type: state.selectedActivityType,
        notes,
        direction,
        created_by: createdBy,
      });

      if (error) { showToast('Error logging activity', 'error'); return; }

      showToast('Activity logged ✓');
      await loadLeads();

      const lead = state.leads.find(l => l.id === state.selectedLeadId);
      if (lead) {
        updatePanelLastContact(lead.last_contact_by);
        await renderActivityTab(lead);
      }
    }

    async function deleteLead() {
      if (!state.selectedLeadId) return;
      const lead = state.leads.find(l => l.id === state.selectedLeadId);
      if (!confirm(`Delete "${lead?.org_name}"? This cannot be undone.`)) return;

      const { error } = await db
        .from('group_order_leads')
        .delete()
        .eq('id', state.selectedLeadId);

      if (error) { showToast('Error deleting lead', 'error'); return; }

      showToast('Lead deleted');
      closePanel();
      await loadLeads();
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // NEW LEAD MODAL
    // ─────────────────────────────────────────────────────────────────────────────
    function openNewLeadModal(defaultStage = 'new_lead') {
      document.getElementById('modalBody').innerHTML = newLeadForm(defaultStage);
      document.getElementById('leadModal').classList.add('open');
      setTimeout(() => document.getElementById('nf_org_name')?.focus(), 100);
    }

    function openNewLeadModalStage(stage) { openNewLeadModal(stage); }

    function closeModal() {
      document.getElementById('leadModal').classList.remove('open');
    }

    function newLeadForm(defaultStage) {
      return `
    <div class="field-group">
      <div class="field-label">Organisation Name *</div>
      <input class="field-input" id="nf_org_name" placeholder="e.g. Maple Ridge Hospital">
    </div>
    <div class="field-row">
      <div class="field-group">
        <div class="field-label">Contact Name</div>
        <input class="field-input" id="nf_contact_name" placeholder="Jane Smith">
      </div>
      <div class="field-group">
        <div class="field-label">Phone</div>
        <input class="field-input" id="nf_contact_phone" placeholder="(604) 555-0100">
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Email</div>
      <input class="field-input" id="nf_contact_email" placeholder="jane@org.com">
    </div>
    <div class="field-row">
      <div class="field-group">
        <div class="field-label">Brand Preferences</div>
        <input class="field-input" id="nf_brand_preferences" placeholder="e.g. Grey's Anatomy">
      </div>
      <div class="field-group">
        <div class="field-label">Colour Preferences</div>
        <input class="field-input" id="nf_colour_preferences" placeholder="e.g. Navy, Royal Blue">
      </div>
    </div>
    <div class="field-group">
      <div class="field-checkbox-row">
        <input type="checkbox" id="nf_male">
        <label for="nf_male">Male Uniforms</label>
        &nbsp;&nbsp;
        <input type="checkbox" id="nf_female">
        <label for="nf_female">Female Uniforms</label>
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Embroidery Notes</div>
      <input class="field-input" id="nf_embroidery_notes" placeholder="e.g. Left chest logo, ~8,000 stitches">
    </div>
    <div class="field-row">
      <div class="field-group">
        <div class="field-label">Estimated Value ($)</div>
        <input class="field-input" type="number" id="nf_estimated_value" placeholder="0.00">
      </div>
      <div class="field-group">
        <div class="field-label">Item Count</div>
        <input class="field-input" type="number" id="nf_item_count" placeholder="0">
      </div>
    </div>
    <div class="field-row">
      <div class="field-group">
        <div class="field-label">Pipeline Stage</div>
        <select class="field-input" id="nf_stage">
          ${STAGES.map(s => `<option value="${s.key}" ${s.key === defaultStage ? 'selected' : ''}>${s.emoji} ${s.label}</option>`).join('')}
        </select>
      </div>
      <div class="field-group">
        <div class="field-label">Next Follow-up Date</div>
        <input class="field-input" type="date" id="nf_next_followup_date">
      </div>
    </div>
    <div class="field-group">
      <div class="field-label">Internal Notes</div>
      <textarea class="field-input field-textarea" id="nf_internal_notes" placeholder="Initial context…"></textarea>
    </div>
  `;
    }

    async function saveNewLead() {
      const org = document.getElementById('nf_org_name').value.trim();
      if (!org) { showToast('Organisation name is required', 'error'); return; }

      const payload = {
        org_name: org,
        contact_name: document.getElementById('nf_contact_name').value.trim() || null,
        contact_email: document.getElementById('nf_contact_email').value.trim() || null,
        contact_phone: document.getElementById('nf_contact_phone').value.trim() || null,
        brand_preferences: document.getElementById('nf_brand_preferences').value.trim() || null,
        colour_preferences: document.getElementById('nf_colour_preferences').value.trim() || null,
        has_male_uniforms: document.getElementById('nf_male').checked,
        has_female_uniforms: document.getElementById('nf_female').checked,
        embroidery_notes: document.getElementById('nf_embroidery_notes').value.trim() || null,
        estimated_value: document.getElementById('nf_estimated_value').value || null,
        item_count: document.getElementById('nf_item_count').value || null,
        stage: document.getElementById('nf_stage').value,
        next_followup_date: document.getElementById('nf_next_followup_date').value || null,
        internal_notes: document.getElementById('nf_internal_notes').value.trim() || null,
      };

      const { data, error } = await db
        .from('group_order_leads')
        .insert(payload)
        .select()
        .single();

      if (error) { showToast('Error creating lead: ' + error.message, 'error'); return; }

      showToast('Lead created ✓');
      closeModal();
      await loadLeads();
      openLead(data.id);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // HELPERS
    // ─────────────────────────────────────────────────────────────────────────────
    function esc(str) {
      if (!str) return '';
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // Logos are uploaded by the B2B Quote Builder into the private `lead-logos`
    // storage bucket; the anon key has a read-only SELECT policy on that bucket
    // only, so we fetch a short-lived signed URL to preview/download.
    async function loadLeadLogo(lead) {
      const box = document.getElementById('logoBox');
      if (!box) return;
      const name = lead.logo_filename || lead.logo_path.split('/').pop();
      const { data, error } = await db.storage.from('lead-logos').createSignedUrl(lead.logo_path, 3600);
      if (error || !data?.signedUrl) {
        // Never show a broken image slot — the file is still in the bucket and
        // attached to the original sales email.
        box.innerHTML = `<div style="font-size:13px;color:var(--tus-ink)">🎨 Logo on file: <strong>${esc(name)}</strong> <span style="color:var(--tus-muted)">(preview unavailable — ${esc(error?.message || 'no access')})</span></div>`;
        return;
      }
      const isImg = /\.(png|jpe?g|gif|webp|svg|bmp|avif)$/i.test(name);
      box.innerHTML = `
        ${isImg ? `<a href="${data.signedUrl}" target="_blank" rel="noopener"><img src="${data.signedUrl}" alt="Customer logo" style="max-width:220px;max-height:120px;border:1px solid var(--tus-line);padding:6px;background:white;display:block;margin-bottom:8px"></a>` : ''}
        <a class="btn btn-secondary btn-sm" style="text-decoration:none" href="${data.signedUrl}" target="_blank" rel="noopener" download="${esc(name)}">⬇ Download ${esc(name)}</a>`;
    }

    // Escape first, then turn bare URLs (e.g. Shopify draft-order invoice links
    // in quote-builder activity notes) into clickable links.
    function linkify(str) {
      return esc(str).replace(/https?:\/\/[^\s<]+/g,
        u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
    }

    function formatDate(d) {
      if (!d) return '';
      return new Date(d + 'T00:00:00').toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
    }

    function formatDateTime(d) {
      if (!d) return '';
      return new Date(d).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    }

    function formatStage(s) {
      return STAGES.find(st => st.key === s)?.label || s;
    }

    let toastTimeout;
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.style.background = type === 'error' ? '#c0392b' : '#003366';
      t.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => t.classList.remove('show'), 3000);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    init();
  </script>
</body>

</html>
